name: Build and Deploy News

on:
  schedule:
    # Run at 2:00 UTC (10:00 AM Singapore Time)
    - cron: '0 2 * * *'
    # Run at 13:00 UTC (9:00 PM Singapore Time)
    - cron: '0 13 * * *'
  
  # Allow manual triggers from GitHub UI
  workflow_dispatch:
  
  # Also run on push to main (for initial setup)
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil anthropic
      
      - name: Build news data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python scripts/build_news.py
      
      - name: Commit updated news data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news_data.json
          git diff --cached --quiet news_data.json || git commit -m "🗞️ Update news data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Pull latest changes
        run: git pull origin main
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
